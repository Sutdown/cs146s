<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modern Software Dev Starter</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main>
      <h1>Modern Software Dev Starter</h1>

      <section>
        <h2>Notes</h2>
        <form id="note-form">
          <input id="note-title" placeholder="Title" required />
          <input id="note-content" placeholder="Content" required />
          <button type="submit">Add</button>
        </form>
        <form id="search-form">
          <input id="search-input" placeholder="Search notes..." />
          <button type="submit">Search</button>
          <button type="button" id="clear-search">Clear</button>
        </form>
        <div id="edit-form" style="display:none;">
          <h3>Edit Note</h3>
          <input id="edit-title" placeholder="Title" />
          <input id="edit-content" placeholder="Content" />
          <button type="button" id="save-edit">Save</button>
          <button type="button" id="cancel-edit">Cancel</button>
        </div>
        <ul id="notes"></ul>
      </section>

      <section>
        <h2>Action Items</h2>
        <form id="action-form">
          <input id="action-desc" placeholder="Description" required />
          <button type="submit">Add</button>
        </form>
        <ul id="actions"></ul>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
