<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Developer's Command Center</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="decoration">
      <div class="shape circle-1"></div>
      <div class="shape circle-2"></div>
      <div class="shape circle-3"></div>
      <div class="shape triangle-1"></div>
      <div class="shape triangle-2"></div>
    </div>
    <main>
      <h1>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        Developer's Command Center
      </h1>

      <section>
        <h2>
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          Notes
        </h2>
        <form id="note-form">
          <input id="note-title" placeholder="Title" required />
          <input id="note-content" placeholder="Content" required />
          <button type="submit">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Add
          </button>
        </form>
        <form id="search-form">
          <input id="search-input" placeholder="Search notes..." />
          <button type="submit">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </button>
          <button type="button" id="clear-search">Clear</button>
        </form>
        <div id="edit-form" style="display:none;">
          <h3>
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            Edit Note
          </h3>
          <input id="edit-title" placeholder="Title" />
          <input id="edit-content" placeholder="Content" />
          <button type="button" id="save-edit">Save</button>
          <button type="button" id="cancel-edit">Cancel</button>
        </div>
        <ul id="notes"></ul>
      </section>

      <section>
        <h2>
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
          Action Items
        </h2>
        <form id="action-form">
          <input id="action-desc" placeholder="Description" required />
          <button type="submit">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Add
          </button>
        </form>
        <ul id="actions"></ul>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
