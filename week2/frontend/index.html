<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Action Item Extractor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      * { 
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      :root {
        --bg-base: #fafafa;
        --bg-card: #ffffff;
        --bg-elevated: #f5f5f7;
        --border: rgba(0, 0, 0, 0.06);
        --border-hover: rgba(0, 0, 0, 0.12);
        --text-primary: #1d1d1f;
        --text-secondary: #6e6e73;
        --text-muted: #aeaeb2;
        --accent-primary: #0071e3;
        --accent-secondary: #5e5ce6;
        --accent-success: #34c759;
        --accent-danger: #ff3b30;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06), 0 2px 4px rgba(0, 0, 0, 0.02);
        --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
      }

      body { 
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
        background: var(--bg-base);
        background-image: 
          radial-gradient(ellipse at 0% 0%, rgba(94, 92, 230, 0.03) 0%, transparent 50%),
          radial-gradient(ellipse at 100% 100%, rgba(0, 113, 227, 0.03) 0%, transparent 50%);
        color: var(--text-primary);
        min-height: 100vh;
        line-height: 1.6;
      }

      .container {
        max-width: 680px;
        margin: 0 auto;
        padding: 4rem 1.5rem;
      }

      .header { 
        text-align: center; 
        margin-bottom: 3rem;
      }

      .logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        border-radius: 14px;
        margin-bottom: 1.5rem;
        box-shadow: var(--shadow-md);
      }

      .logo svg {
        width: 28px;
        height: 28px;
        color: white;
      }

      h1 { 
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: var(--text-primary);
        margin-bottom: 0.5rem;
      }

      .subtitle { 
        color: var(--text-secondary);
        font-size: 1rem;
        font-weight: 400;
      }

      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 1.75rem;
        margin-bottom: 1.5rem;
        box-shadow: var(--shadow-sm);
        transition: all 0.2s ease;
      }

      .card:hover {
        box-shadow: var(--shadow-md);
        border-color: var(--border-hover);
      }

      .input-label {
        display: block;
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 0.75rem;
        letter-spacing: -0.01em;
      }

      textarea { 
        width: 100%; 
        min-height: 130px; 
        padding: 1rem; 
        border: 1.5px solid var(--border);
        border-radius: 12px;
        font-family: 'JetBrains Mono', monospace; 
        font-size: 0.875rem;
        resize: vertical;
        background: var(--bg-base);
        color: var(--text-primary);
        transition: all 0.2s ease;
        line-height: 1.7;
      }

      textarea:focus { 
        outline: none; 
        border-color: var(--accent-primary);
        background: white;
        box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.08);
      }

      textarea::placeholder { 
        color: var(--text-muted); 
      }

      .controls {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 1rem;
      }

      .checkbox-wrapper {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
        padding: 0.5rem 0.75rem;
        background: var(--bg-elevated);
        border-radius: 8px;
        font-size: 0.8125rem;
        color: var(--text-secondary);
        transition: all 0.15s;
        user-select: none;
      }

      .checkbox-wrapper:hover {
        background: var(--bg-base);
        color: var(--text-primary);
      }

      input[type="checkbox"] { 
        width: 16px; 
        height: 16px; 
        accent-color: var(--accent-primary); 
        cursor: pointer;
        border-radius: 4px;
      }

      .btn-row { 
        display: flex; 
        gap: 0.75rem; 
        flex-wrap: wrap;
        margin-top: 1.25rem;
      }

      button { 
        padding: 0.7rem 1.25rem; 
        border: none; 
        border-radius: 10px; 
        cursor: pointer; 
        font-family: 'Inter', sans-serif;
        font-weight: 600; 
        font-size: 0.875rem;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }

      button:active { transform: scale(0.98); }
      button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

      .btn-primary { 
        background: var(--text-primary);
        color: white;
        box-shadow: var(--shadow-sm);
      }
      .btn-primary:hover { 
        box-shadow: var(--shadow-md);
        transform: translateY(-1px);
      }

      .btn-secondary { 
        background: var(--accent-secondary);
        color: white;
        box-shadow: var(--shadow-sm);
      }
      .btn-secondary:hover { 
        box-shadow: var(--shadow-md);
        transform: translateY(-1px);
      }

      .btn-ghost {
        background: var(--bg-elevated);
        color: var(--text-secondary);
        border: 1px solid var(--border);
      }
      .btn-ghost:hover {
        background: var(--bg-card);
        color: var(--text-primary);
        border-color: var(--border-hover);
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid var(--border);
      }

      .section-title {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .count-badge {
        font-size: 0.75rem;
        font-weight: 500;
        padding: 0.25rem 0.625rem;
        background: var(--bg-elevated);
        border-radius: 100px;
        color: var(--text-muted);
      }

      .item-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .item { 
        display: flex; 
        align-items: center; 
        gap: 0.875rem;
        padding: 0.875rem 1rem;
        background: var(--bg-base);
        border: 1px solid var(--border);
        border-radius: 10px;
        transition: all 0.2s;
        animation: fadeSlideIn 0.25s ease forwards;
        opacity: 0;
      }

      .item:hover { 
        background: var(--bg-elevated);
        border-color: var(--border-hover);
      }

      .item input[type="checkbox"] { 
        width: 20px; 
        height: 20px;
        flex-shrink: 0;
        border-radius: 6px;
      }

      .item-text { 
        flex: 1;
        color: var(--text-primary);
        font-size: 0.9375rem;
        font-weight: 450;
      }

      .item.done .item-text { 
        text-decoration: line-through;
        color: var(--text-muted);
      }

      .item.done {
        opacity: 0.6;
      }

      .note-card {
        padding: 1.125rem;
        background: var(--bg-base);
        border: 1px solid var(--border);
        border-radius: 12px;
        margin-bottom: 0.75rem;
        transition: all 0.2s;
        animation: fadeSlideIn 0.25s ease forwards;
      }

      .note-card:hover {
        background: var(--bg-elevated);
        border-color: var(--border-hover);
      }

      .note-tasks {
        font-size: 0.875rem;
        color: var(--text-secondary);
        line-height: 1.7;
        margin-bottom: 0.75rem;
      }

      .note-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 0.625rem;
        border-top: 1px solid var(--border);
      }

      .note-time {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .delete-btn {
        background: transparent;
        color: var(--text-muted);
        padding: 0.375rem 0.75rem;
        font-size: 0.75rem;
        font-weight: 500;
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .delete-btn:hover {
        background: rgba(255, 59, 48, 0.06);
        border-color: rgba(255, 59, 48, 0.2);
        color: var(--accent-danger);
      }

      .empty-state { 
        text-align: center; 
        padding: 2.5rem 1rem;
        color: var(--text-muted);
      }

      .empty-icon {
        width: 40px;
        height: 40px;
        margin: 0 auto 0.875rem;
        opacity: 0.5;
      }

      .empty-state p {
        font-size: 0.875rem;
      }

      .loading { 
        display: inline-block; 
        width: 16px; 
        height: 16px; 
        border: 2px solid rgba(255,255,255,0.3); 
        border-top-color: currentColor; 
        border-radius: 50%; 
        animation: spin 0.7s linear infinite;
      }

      .toast { 
        position: fixed; 
        top: 1.5rem; 
        left: 50%; 
        transform: translateX(-50%) translateY(-120%);
        background: var(--text-primary);
        color: white;
        padding: 0.875rem 1.5rem;
        border-radius: 12px;
        box-shadow: var(--shadow-lg);
        font-size: 0.875rem;
        font-weight: 500;
        z-index: 1000;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .toast.show { transform: translateX(-50%) translateY(0); }
      .toast.error { background: var(--accent-danger); }
      .toast.success { background: var(--accent-success); }

      .toast-icon {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }

      .confetti { 
        position: fixed; 
        pointer-events: none; 
        font-size: 1.25rem; 
        animation: confettiFall 0.8s ease-out forwards;
        z-index: 999;
      }

      .divider {
        height: 1px;
        background: var(--border);
        margin: 1.5rem 0;
      }

      @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      @keyframes confettiFall { 
        0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
        100% { opacity: 0; transform: translateY(60px) rotate(180deg) scale(0.5); }
      }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
  </head>
  <body>
    <div class="toast" id="toast"></div>

    <div class="container">
      <div class="header">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
        </div>
        <h1>Action Item Extractor</h1>
        <p class="subtitle">Transform notes into structured tasks</p>
      </div>

      <div class="card">
        <label class="input-label" for="text">Your Notes</label>
        <textarea id="text" placeholder="Paste your notes here...&#10;&#10;Example:&#10;- [ ] Buy groceries&#10;- Finish project report&#10;todo: Schedule meeting"></textarea>
        
        <div class="controls">
          <label class="checkbox-wrapper">
            <input id="save_note" type="checkbox" checked />
            Save to notes
          </label>
        </div>

        <div class="btn-row">
          <button class="btn-primary" id="extract">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            Extract Tasks
          </button>
          <button class="btn-secondary" id="extract_llm">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            AI Extract
          </button>
          <button class="btn-ghost" id="list_notes">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            All Notes
          </button>
        </div>
      </div>

      <div id="results"></div>

    </div>

    <script>
      const $ = (sel) => document.querySelector(sel);
      const resultsEl = $('#results');
      const btn = $('#extract');
      const btnLlm = $('#extract_llm');
      const btnListNotes = $('#list_notes');
      const toast = $('#toast');

      function showToast(msg, isError = false) {
        const icon = isError 
          ? '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
          : '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
        toast.innerHTML = icon + '<span>' + msg + '</span>';
        toast.className = 'toast' + (isError ? ' error' : ' success');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      }

      function createConfetti(x, y) {
        const symbols = ['✓', '★', '●', '◆'];
        for (let i = 0; i < 5; i++) {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          confetti.textContent = symbols[Math.floor(Math.random() * symbols.length)];
          confetti.style.left = (x + (Math.random() - 0.5) * 60) + 'px';
          confetti.style.top = y + 'px';
          confetti.style.color = ['#0071e3', '#5e5ce6', '#34c759', '#ff9500'][Math.floor(Math.random() * 4)];
          document.body.appendChild(confetti);
          setTimeout(() => confetti.remove(), 800);
        }
      }

      function renderItems(data, title = 'Extracted Tasks') {
        const existingNotes = $('#notes-section');
        if (existingNotes) existingNotes.remove();

        const html = `
          <div id="extracted" class="card">
            <div class="section-header">
              <span class="section-title">${title}</span>
              <span class="count-badge">${data.items?.length || 0}</span>
            </div>
            <div class="item-list">
              ${!data.items || data.items.length === 0 
                ? `<div class="empty-state">
                    <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                      <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                    </svg>
                    <p>No tasks found. Try adding some items to extract.</p>
                  </div>`
                : data.items.map((it, i) => `
                  <div class="item" style="animation-delay: ${i * 0.04}s">
                    <input type="checkbox" data-id="${it.id}" ${it.done ? 'checked' : ''} />
                    <span class="item-text">${it.text}</span>
                  </div>
                `).join('')
              }
            </div>
          </div>
        `;
        
        if ($('#extracted')) {
          $('#extracted').outerHTML = html;
        } else {
          resultsEl.innerHTML = html;
        }
      }

      function renderNotes(notesData) {
        const html = `
          <div id="notes-section" class="card" style="margin-top: 1.5rem;">
            <div class="section-header">
              <span class="section-title">Notes History</span>
              <span class="count-badge">${notesData.length}</span>
            </div>
            ${notesData.length === 0
              ? `<div class="empty-state">
                  <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
                    <polyline points="17 21 17 13 7 13 7 21"/>
                    <polyline points="7 3 7 8 15 8"/>
                  </svg>
                  <p>No saved notes yet.</p>
                </div>`
              : notesData.map(({ note, items }) => `
                  <div class="note-card" data-note-id="${note.id}">
                    <div class="note-tasks">
                      ${items.map(item => item.text).join('<br>') || '<span style="color: var(--text-muted)">No tasks extracted</span>'}
                    </div>
                    <div class="note-meta">
                      <span class="note-time">${new Date(note.created_at).toLocaleString()}</span>
                      <button class="delete-btn" data-note-id="${note.id}">Delete</button>
                    </div>
                  </div>
                `).join('')
            }
          </div>
        `;

        const existingNotes = $('#notes-section');
        if (existingNotes) {
          existingNotes.outerHTML = html;
        } else {
          resultsEl.innerHTML += html;
        }

        document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const card = e.target.closest('.note-card');
            createConfetti(e.clientX, e.clientY);
            try {
              const res = await fetch(`/notes/${btn.dataset.noteId}`, { method: 'DELETE' });
              if (res.ok) {
                card.style.opacity = '0';
                card.style.transform = 'translateX(20px)';
                setTimeout(() => card.remove(), 250);
                showToast('Note deleted');
              }
            } catch (err) {
              showToast('Delete failed', true);
            }
          });
        });
      }

      function setLoading(btn, loading) {
        if (loading) {
          btn.disabled = true;
          btn.dataset.originalHtml = btn.innerHTML;
          btn.innerHTML = '<span class="loading"></span>';
        } else {
          btn.disabled = false;
          btn.innerHTML = btn.dataset.originalHtml;
        }
      }

      btn.addEventListener('click', async () => {
        const text = $('#text').value;
        if (!text.trim()) {
          showToast('Please enter some notes first', true);
          return;
        }
        const save = $('#save_note').checked;
        setLoading(btn, true);
        try {
          const res = await fetch('/action-items/extract', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, save_note: save }),
          });
          if (!res.ok) throw new Error('Request failed');
          const data = await res.json();
          renderItems(data);
          if (save) showToast('Note saved');
        } catch (err) {
          showToast('Extraction failed', true);
        } finally {
          setLoading(btn, false);
        }
      });

      btnLlm.addEventListener('click', async () => {
        const text = $('#text').value;
        if (!text.trim()) {
          showToast('Please enter some notes first', true);
          return;
        }
        const save = $('#save_note').checked;
        setLoading(btnLlm, true);
        try {
          const res = await fetch('/action-items/extract-llm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, save_note: save }),
          });
          if (!res.ok) throw new Error('Request failed');
          const data = await res.json();
          renderItems(data, 'AI Extracted Tasks');
          if (save) showToast('Note saved');
        } catch (err) {
          showToast('AI extraction failed', true);
        } finally {
          setLoading(btnLlm, false);
        }
      });

      btnListNotes.addEventListener('click', async () => {
        setLoading(btnListNotes, true);
        try {
          const res = await fetch('/notes');
          if (!res.ok) throw new Error('Request failed');
          const notes = await res.json();
          
          const notesData = await Promise.all(notes.map(async note => {
            const itemsRes = await fetch(`/action-items?note_id=${note.id}`);
            const items = itemsRes.ok ? await itemsRes.json() : [];
            return { note, items };
          }));
          
          renderNotes(notesData);
        } catch (err) {
          showToast('Failed to load notes', true);
        } finally {
          setLoading(btnListNotes, false);
        }
      });

      resultsEl.addEventListener('change', async (e) => {
        if (e.target.type === 'checkbox' && e.target.dataset.id) {
          const item = e.target.closest('.item');
          const span = item.querySelector('.item-text');
          
          if (e.target.checked) {
            item.classList.add('done');
            createConfetti(e.clientX, e.clientY);
            showToast('Task completed');
          } else {
            item.classList.remove('done');
          }
          
          await fetch(`/action-items/${e.target.dataset.id}/done`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ done: e.target.checked }),
          });
        }
      });

    </script>
  </body>
</html>
